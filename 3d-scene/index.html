<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Floppy Portfolio</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <main id="scene"></main>

  <div class="grain"></div>
  <div class="scanlines"></div>

  <header class="site-header">
    <div class="brand">
      PORTFOLIO<span>_A:</span>
    </div>
    <div class="status">
      <i></i>
      SYSTEM READY
    </div>
  </header>

  <div id="loading">
    <div class="loader-box">
      <span>BOOTING</span>
      <strong>3D PORTFOLIO</strong>
      <small>PLEASE WAIT...</small>
    </div>
  </div>

  <section id="intro">
    <p class="eyebrow">A: / FLOPPY DRIVE</p>
    <h1>Choose your <em>disk</em></h1>
    <p class="sub">Hover to inspect · Click to insert</p>
  </section>

  <div class="carousel-hint">
    <span>←</span>
    <div>
      <b>01</b>
      <i></i>
      <b>06</b>
    </div>
    <span>→</span>
  </div>

  <!-- ======================================================
       TERMINAL
       ====================================================== -->

  <div id="terminal" class="hidden" aria-hidden="true">
    <div class="terminal-window">

      <div class="terminal-titlebar">
        <div class="terminal-title">
          <span class="terminal-icon">▣</span>
          <span>terminal</span>
          <span class="terminal-sep">—</span>
          <span id="terminalPath">A:\</span>
        </div>

        <button
          id="terminalClose"
          class="terminal-close"
          aria-label="Закрыть"
        >×</button>
      </div>

      <div class="terminal-body" id="terminalBody">
        <pre id="terminalOutput"></pre>
      </div>

      <div class="terminal-scanline"></div>
      <div class="terminal-vignette"></div>

    </div>
  </div>

  <script type="module" src="./script.js"></script>

</body>
</html>
