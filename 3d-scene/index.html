<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Floppy Portfolio</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <main id="scene"></main>

  <div class="grain"></div>
  <div class="scanlines"></div>

  <header class="site-header">
    <div class="brand">
      PORTFOLIO<span>_A:</span>
    </div>

    <div class="status">
      <i></i>
      SYSTEM READY
    </div>
  </header>

  <div id="loading">
    <div class="loader-box">
      <span>BOOTING</span>
      <strong>3D PORTFOLIO</strong>
      <small>PLEASE WAIT...</small>
    </div>
  </div>

  <section id="intro">
    <p class="eyebrow">A: / FLOPPY DRIVE</p>
    <h1>Choose your <em>disk</em></h1>
    <p class="sub">Hover to inspect · Click to insert</p>
  </section>

  <div id="screenUI" class="hidden">
    <button id="closeScreen" aria-label="Закрыть">×</button>
    <div class="screen-frame">
      <div class="screen-top">
        <span>FLOPPY://READ</span>
        <span>● ONLINE</span>
      </div>
      <div id="screenContent"></div>
    </div>
  </div>

  <script type="module" src="./script.js"></script>

</body>
</html>
